plugins {
    id 'com.android.application'
}
android {
    namespace 'ar.com.calma.instagram'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.com.calma.instagram'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.3.6'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
